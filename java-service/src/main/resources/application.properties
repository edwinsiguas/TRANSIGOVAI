spring.application.name=mtc-java-service
server.port=${PORT:8081}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marcona_permisos}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
app.environment=${APP_ENV:development}
app.-secret=${_SECRET:dev_only_change_me}
app.-expiry-seconds=${_EXPIRY:86400}
app.audit-file=${APP_AUDIT_FILE:logs/database-audit.jsonl}
app.api-url=${API_URL:http://localhost:8081}
app.uploads-dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-part-count=200
server.tomcat.max-part-header-size=4096
server.tomcat.max-parameter-count=10000
logging.level.root=INFO
logging.level.pe.marcona.mtc=INFO

