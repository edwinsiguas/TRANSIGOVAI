spring.application.name=mtc-java-service
server.port=${PORT:8081}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marcona_permisos}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
app.environment=${APP_ENV:development}
app.jwt-secret=${JWT_SECRET:dev_only_change_me}
app.jwt-expiry-seconds=${JWT_EXPIRY:86400}
app.audit-file=${APP_AUDIT_FILE:../api/storage/logs/database-audit.jsonl}
app.api-url=${API_URL:http://localhost/api}
logging.level.root=INFO
logging.level.pe.marcona.mtc=INFO
